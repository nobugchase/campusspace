<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusSpace — бронирование помещения</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">CampusSpace</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Помещения</a></li>
          <li class="nav-item"><a class="nav-link" href="cabinet.html">Личный кабинет</a></li>
        </ul>
        <select id="user-select" class="form-select form-select-sm w-auto" aria-label="Текущий пользователь"></select>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <a href="index.html" class="d-inline-block mb-3">← К списку помещений</a>
    <div id="room-error" class="alert alert-danger d-none"></div>

    <div class="row g-4">
      <section class="col-12 col-lg-5" id="room-info"></section>

      <section class="col-12 col-lg-7">
        <div class="card card-body mb-3">
          <h2 class="h5">Выберите дату и время</h2>
          <div class="mb-3">
            <label for="booking-date" class="form-label">Дата</label>
            <input id="booking-date" type="date" class="form-control w-auto">
          </div>
          <div class="small text-muted mb-2">
            <span class="badge text-bg-success">Свободно</span>
            <span class="badge text-bg-danger">Занято</span>
            <span class="badge text-bg-warning">На согласовании</span>
            <span class="badge text-bg-secondary">Прошло</span>
            Выберите слот (по 30 минут) или несколько слотов подряд.
          </div>
          <div id="slot-grid" class="slot-grid"></div>
        </div>

        <form id="booking-form" class="card card-body d-none">
          <h2 class="h5">Бронирование</h2>
          <p id="selection-summary" class="fw-bold"></p>
          <div class="mb-3">
            <label for="booking-purpose" class="form-label">Цель</label>
            <input id="booking-purpose" type="text" class="form-control" maxlength="255" placeholder="Например, проектная встреча" required>
          </div>
          <div class="mb-3">
            <label for="booking-attendees" class="form-label">Количество человек</label>
            <input id="booking-attendees" type="number" min="1" class="form-control" required>
          </div>
          <div id="booking-error" class="alert alert-danger d-none"></div>
          <button type="submit" class="btn btn-primary">Забронировать</button>
        </form>
      </section>
    </div>
  </main>

  <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="confirm-title">Бронирование оформлено</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body" id="confirm-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Остаться здесь</button>
          <a href="cabinet.html" class="btn btn-primary">Перейти в личный кабинет</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
