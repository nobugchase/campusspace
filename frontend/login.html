<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusSpace — вход</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-brand fw-bold">CampusSpace</span>
    </div>
  </nav>

  <main class="container py-5" style="max-width: 480px;">
    <div class="card card-body">
      <ul class="nav nav-pills nav-fill mb-3" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">Вход</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">Регистрация</button>
        </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
          <form id="login-form">
            <div class="mb-3">
              <label for="login-email" class="form-label">Email</label>
              <input id="login-email" type="email" class="form-control" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label for="login-password" class="form-label">Пароль</label>
              <input id="login-password" type="password" class="form-control" required autocomplete="current-password">
            </div>
            <div id="login-error" class="alert alert-danger d-none"></div>
            <button type="submit" class="btn btn-primary w-100">Войти</button>
          </form>
          <div class="small text-muted mt-3">
            Тестовые аккаунты:<br>
            student@campus.local / student123<br>
            teacher@campus.local / teacher123<br>
            admin@campus.local / admin123
          </div>
        </div>

        <div class="tab-pane fade" id="register-pane" role="tabpanel">
          <form id="register-form">
            <div class="mb-3">
              <label for="register-name" class="form-label">Имя и фамилия</label>
              <input id="register-name" type="text" class="form-control" required maxlength="120">
            </div>
            <div class="mb-3">
              <label for="register-email" class="form-label">Email</label>
              <input id="register-email" type="email" class="form-control" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label for="register-faculty" class="form-label">Факультет (необязательно)</label>
              <input id="register-faculty" type="text" class="form-control" maxlength="120">
            </div>
            <div class="mb-3">
              <label for="register-password" class="form-label">Пароль (не короче 6 символов)</label>
              <input id="register-password" type="password" class="form-control" required minlength="6" autocomplete="new-password">
            </div>
            <div id="register-error" class="alert alert-danger d-none"></div>
            <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
