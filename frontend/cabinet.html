<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusSpace — личный кабинет</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">CampusSpace</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Помещения</a></li>
          <li class="nav-item"><a class="nav-link active" href="cabinet.html">Личный кабинет</a></li>
        </ul>
        <select id="user-select" class="form-select form-select-sm w-auto" aria-label="Текущий пользователь"></select>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-3">Личный кабинет</h1>
    <div id="cabinet-message" class="alert d-none"></div>
    <div id="reminders"></div>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <h2 class="h5 mb-0">Уведомления <span id="unread-badge" class="badge bg-danger d-none"></span></h2>
      <button id="read-all-btn" class="btn btn-sm btn-outline-secondary">Прочитать все</button>
    </div>
    <div id="notifications-list" class="list-group mb-4"></div>
    <h2 class="h5">Активные бронирования</h2>
    <div id="active-list" class="row g-3 mb-4"></div>
        <h2 class="h5">Повторяющиеся бронирования</h2>
    <div id="recurring-list" class="row g-3 mb-4"></div>
    <h2 class="h5">История бронирований</h2>
    <div id="history-list" class="row g-3"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cabinet.js"></script>
</body>
</html>
