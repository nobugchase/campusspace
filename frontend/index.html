<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusSpace — каталог помещений</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">CampusSpace</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Помещения</a></li>
          <li class="nav-item"><a class="nav-link" href="cabinet.html">Личный кабинет</a></li>
        </ul>
        <select id="user-select" class="form-select form-select-sm w-auto" aria-label="Текущий пользователь"></select>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-3">Каталог помещений</h1>

    <form id="filter-form" class="card card-body mb-4">
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <label for="filter-search" class="form-label">Название</label>
          <input id="filter-search" type="text" class="form-control" placeholder="Например, переговорная">
        </div>
        <div class="col-6 col-md-2">
          <label for="filter-capacity" class="form-label">Вместимость от</label>
          <input id="filter-capacity" type="number" min="1" class="form-control" placeholder="чел.">
        </div>
        <div class="col-6 col-md-3">
          <label for="filter-type" class="form-label">Тип помещения</label>
          <select id="filter-type" class="form-select"><option value="">Любой</option></select>
        </div>
        <div class="col-12 col-md-3">
          <label for="filter-building" class="form-label">Корпус</label>
          <select id="filter-building" class="form-select"><option value="">Любой</option></select>
        </div>
        <div class="col-12">
          <span class="form-label d-block">Оснащение</span>
          <div id="filter-equipment" class="d-flex flex-wrap gap-3"></div>
        </div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Найти</button>
          <button type="reset" id="filter-reset" class="btn btn-outline-secondary">Сбросить</button>
        </div>
      </div>
    </form>

    <div id="rooms-message" class="text-muted mb-2"></div>
    <div id="rooms-list" class="row g-4"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
